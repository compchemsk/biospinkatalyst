name: Update publications from Google Scholar

on:
  schedule:
    - cron: "17 1 * * *"   # every day at 06:47 IST
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scholarly
        run: pip install scholarly==1.7.11

      - name: Fetch Google Scholar profile
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scripts/update_publications.py

      - name: Commit if the list changed
        run: |
          if git diff --quiet -- data/publications.json; then
            echo "No new publications."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/publications.json
            git commit -m "Update publications from Google Scholar"
            git push
          fi
